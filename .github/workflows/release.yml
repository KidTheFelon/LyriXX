name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --legacy-peer-deps

      - name: Set version from tag
        shell: pwsh
        run: |
          $tag = "${{ env.TAG }}" -replace '^v', ''
          $cargo = Get-Content "src-tauri/Cargo.toml" -Raw
          $cargo = $cargo -replace 'version = "[^"]*"', "version = `"$tag`""
          Set-Content "src-tauri/Cargo.toml" $cargo -NoNewline

          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw
          $conf = $conf -replace '"version":\s*"[^"]*"', "`"version`": `"$tag`""
          Set-Content "src-tauri/tauri.conf.json" $conf -NoNewline

          $pkg = Get-Content "package.json" -Raw
          $pkg = $pkg -replace '"version":\s*"[^"]*"', "`"version`": `"$tag`""
          Set-Content "package.json" $pkg -NoNewline

          echo "Set version to $tag in Cargo.toml, tauri.conf.json, package.json"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}

      - name: Zip portable exe
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/target/release/LyriXX.exe" -DestinationPath "LyriXX-${{ env.TAG }}-portable.zip"

      - name: Upload portable zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ env.TAG }} "LyriXX-${{ env.TAG }}-portable.zip"

      - name: Generate changelog and update release body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.TAG }}"
          REPO="${{ github.repository }}"

          # Get previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Build changelog
          {
            echo "## What's Changed"
            echo ""

            # Features
            FEATS=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^feat" --no-merges 2>/dev/null || true)
            if [ -n "$FEATS" ]; then
              echo "### Features"
              echo "$FEATS"
              echo ""
            fi

            # Bug Fixes
            FIXES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^fix" --no-merges 2>/dev/null || true)
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            # Performance
            PERFS=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^perf" --no-merges 2>/dev/null || true)
            if [ -n "$PERFS" ]; then
              echo "### Performance"
              echo "$PERFS"
              echo ""
            fi

            # Documentation
            DOCS=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^docs" --no-merges 2>/dev/null || true)
            if [ -n "$DOCS" ]; then
              echo "### Documentation"
              echo "$DOCS"
              echo ""
            fi

            # Miscellaneous (chore)
            CHORES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^chore" --no-merges 2>/dev/null || true)
            if [ -n "$CHORES" ]; then
              echo "### Miscellaneous"
              echo "$CHORES"
              echo ""
            fi

            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          } > CHANGELOG_BODY.md

          gh release edit "$TAG" --repo "$REPO" --notes-file CHANGELOG_BODY.md
