name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init submodule
        shell: bash
        run: |
          git submodule init src-tauri/quickpoeter
          git config submodule.src-tauri/quickpoeter.url https://github.com/sitandr/quickpoeter_core.git
          git submodule update --depth=1 src-tauri/quickpoeter

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --legacy-peer-deps

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LyriXX ${{ github.ref_name }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false

      - name: Zip portable exe
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/target/release/LyriXX.exe" -DestinationPath "LyriXX-${{ github.ref_name }}-portable.zip"

      - name: Upload portable zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} "LyriXX-${{ github.ref_name }}-portable.zip"
