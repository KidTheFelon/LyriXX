name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Init submodule
        shell: bash
        run: |
          git submodule init src-tauri/quickpoeter
          git config submodule.src-tauri/quickpoeter.url https://github.com/sitandr/quickpoeter_core.git
          git submodule update --depth=1 src-tauri/quickpoeter

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --legacy-peer-deps

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}

      - name: Zip portable exe
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/target/release/LyriXX.exe" -DestinationPath "LyriXX-${{ env.TAG }}-portable.zip"

      - name: Upload portable zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ env.TAG }} "LyriXX-${{ env.TAG }}-portable.zip"
