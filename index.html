<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>LyriXX</title>
    <style>
      html {
        background: #f3f3f3;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #1c1c1c;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var req = indexedDB.open("lyrixx-theme-cache", 1);
          // Optimistic: read from DB synchronously via localStorage fallback
        } catch (e) {}
        // Apply stored theme before React hydration to prevent flash
        var stored = null;
        try {
          // theme is stored in DB via Tauri, but splash reads it via __setTheme
          // For main window, the Rust side sets data-theme before show
          // This script runs before React, so just ensure body has the right background
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.style.background = dark ? "#1c1c1c" : "#f3f3f3";
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
