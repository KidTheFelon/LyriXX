<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyriXX</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 400px;
        height: 280px;
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        background: #f3f3f3;
        color: #1a1a1a;
        -webkit-user-select: none;
        user-select: none;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1c1c;
          color: #ffffff;
        }
      }

      html[data-theme="light"] body {
        background: #f3f3f3;
        color: #1a1a1a;
      }
      html[data-theme="dark"] body {
        background: #1c1c1c;
        color: #ffffff;
      }

      .splash {
        text-align: center;
        width: 100%;
        padding: 0 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-img {
        width: 120px;
        height: 80px;
        object-fit: contain;
        margin-bottom: 16px;
        opacity: 0.9;
        filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.5));
      }

      .logo-light { display: none; }
      .logo-dark { display: inline; }

      @media (prefers-color-scheme: light) {
        .logo-light { display: inline; }
        .logo-dark { display: none; }
      }
      @media (prefers-color-scheme: dark) {
        .logo-light { display: none; }
        .logo-dark { display: inline; }
      }

      html[data-theme="light"] .logo-light { display: inline; }
      html[data-theme="light"] .logo-dark { display: none; }
      html[data-theme="dark"] .logo-light { display: none; }
      html[data-theme="dark"] .logo-dark { display: inline; }

      .subtitle {
        font-size: 11px;
        color: #616161;
        margin-bottom: 24px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      @media (prefers-color-scheme: dark) {
        .subtitle {
          color: #9e9e9e;
        }
      }

      html[data-theme="light"] .subtitle {
        color: #616161;
      }
      html[data-theme="dark"] .subtitle {
        color: #9e9e9e;
      }

      .status {
        font-size: 12px;
        color: #9e9e9e;
        min-height: 18px;
        margin-bottom: 16px;
        transition: opacity 0.2s ease;
      }

      @media (prefers-color-scheme: dark) {
        .status {
          color: #7a7a7a;
        }
      }

      html[data-theme="light"] .status {
        color: #9e9e9e;
      }
      html[data-theme="dark"] .status {
        color: #7a7a7a;
      }

      .loading {
        display: flex;
        gap: 5px;
        justify-content: center;
      }

      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #005fb8;
        animation: pulse 1.4s ease-in-out infinite;
      }

      .dot:nth-child(2) {
        animation-delay: 0.16s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes pulse {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.4;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img
        src="Wide310x150Logo-inverted.scale-200.png"
        alt="LyriXX"
        class="logo-img logo-light"
        width="120"
        height="80"
      /><img
        src="Wide310x150Logo.scale-200.png"
        alt="LyriXX"
        class="logo-img logo-dark"
        width="120"
        height="80"
      />
      <div class="subtitle" id="subtitle"></div>
      <div class="status" id="status"></div>
      <div class="loading">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
    <script>
      var lang = (navigator.language || "en").startsWith("ru") ? "ru" : "en";

      var strings = {
        subtitle: { ru: "Тетрадь для песен", en: "Songwriting Notebook" },
        init: { ru: "Инициализация\u2026", en: "Initializing\u2026" },
        config: { ru: "Загрузка настроек\u2026", en: "Loading settings\u2026" },
        db: { ru: "Загрузка базы данных\u2026", en: "Loading database\u2026" },
        backup: { ru: "Проверка резервных копий\u2026", en: "Checking backups\u2026" },
        plugins: { ru: "Инициализация плагинов\u2026", en: "Initializing plugins\u2026" },
        tray: { ru: "Настройка системного трея\u2026", en: "Setting up system tray\u2026" },
        rhymes: { ru: "Загрузка словаря рифм\u2026", en: "Loading rhyme dictionary\u2026" },
        frontend: { ru: "Загрузка интерфейса\u2026", en: "Loading interface\u2026" },
        ready: { ru: "Готово!", en: "Ready!" },
      };

      function t(key) {
        return (strings[key] && strings[key][lang]) || (strings[key] && strings[key]["en"]) || key;
      }

      document.getElementById("subtitle").textContent = t("subtitle");
      document.getElementById("status").textContent = t("init");

      function applyTheme(theme) {
        var root = document.documentElement;
        if (theme === "dark") {
          root.setAttribute("data-theme", "dark");
          root.style.colorScheme = "dark";
        } else if (theme === "light") {
          root.setAttribute("data-theme", "light");
          root.style.colorScheme = "light";
        } else {
          root.removeAttribute("data-theme");
          root.style.colorScheme = "";
        }
      }

      window.__splashStatus = function (key) {
        var el = document.getElementById("status");
        if (!el) return;
        el.style.opacity = "0";
        setTimeout(function () {
          el.textContent = t(key);
          el.style.opacity = "1";
        }, 150);
      };

      window.__setTheme = function (theme) {
        applyTheme(theme);
      };

      window.addEventListener("message", function (e) {
        if (!e.data) return;
        if (e.data.type === "setStatus") window.__splashStatus(e.data.status);
        if (e.data.type === "setTheme") window.__setTheme(e.data.theme);
      });
    </script>
  </body>
</html>
