[package]
name = "lyrixx"
version = "0.3.0"
description = "LyriXX — songwriting notebook"
authors = ["lyrixx"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lyrixx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
quickpoeter = { path = "quickpoeter" }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
winreg = "0.52"
webview2-com-sys = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true

